name: Build site

on:
  push:
    branches: [master]
    paths:
      - "*.md"
      - build.py
      - templates/**
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python3 -m pip install weasyprint

      - name: Build site and PDF
        run: python3 build.py

      - name: Commit built files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild site [skip ci]"
          file_pattern: index.html projects/index.html cv/index.html cv/*.pdf
