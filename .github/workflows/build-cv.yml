name: Build site

on:
  push:
    branches: [master]
    paths:
      - "*.md"
      - "posts/**"
      - build.py
      - flake.nix
      - flake.lock
      - templates/**
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Lint
        run: nix flake check --print-build-logs

      - name: Build site and PDF
        run: nix run --print-build-logs .

      - name: Validate build output
        run: |
          test -f index.html
          test -f projects/index.html
          test -f blog/index.html
          test -f blog/welcome-to-my-blog/index.html
          grep -q 'welcome-to-my-blog' blog/index.html
          test -f cv/index.html
          test -f cv/tomas-xavier-santos-cv.pdf
          grep -q 'projects/' index.html
          grep -q 'blog/' index.html

      - name: Commit built files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild site [skip ci]"
          file_pattern: index.html projects/index.html blog/** cv/index.html cv/*.pdf
