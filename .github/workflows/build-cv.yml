name: Build site

on:
  push:
    branches: [master]
    paths:
      - "*.md"
      - build.py
      - requirements.txt
      - templates/**
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check build.py

      - name: Build site and PDF
        run: python3 build.py

      - name: Validate build output
        run: |
          test -f index.html
          test -f projects/index.html
          test -f blog/index.html
          test -f cv/index.html
          test -f cv/tomas-xavier-santos-cv.pdf
          grep -q 'projects/' index.html
          grep -q 'blog/' index.html

      - name: Commit built files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild site [skip ci]"
          file_pattern: index.html projects/index.html blog/index.html cv/index.html cv/*.pdf
