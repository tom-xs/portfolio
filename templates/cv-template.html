<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ name }} — CV</title>
<meta name="description" content="CV of {{ name }}, {{ tagline }}">
<style>
  :root {
    --accent: #1f4e79;
    --text: #1c1c1e;
    --muted: #5b5b60;
    --rule: #d8d8dc;
    --bg: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.55;
  }
  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 3rem 1.75rem 4rem;
  }

  /* Header */
  header { border-bottom: 3px solid var(--accent); padding-bottom: 1.1rem; margin-bottom: 1.6rem; }
  h1 { font-size: 2rem; letter-spacing: 0.01em; }
  .tagline { font-size: 1.05rem; color: var(--accent); font-weight: 600; margin-top: 0.15rem; }
  .contact { margin-top: 0.6rem; font-size: 0.9rem; color: var(--muted); }
  .contact a { color: var(--muted); text-decoration: none; }
  .contact a:hover { color: var(--accent); text-decoration: underline; }
  .contact span + span::before, .contact a + span::before, .contact span + a::before, .contact a + a::before {
    content: " \2022  "; color: #b9b9be;
  }
  .pdf-link {
    display: inline-block; margin-top: 0.8rem; font-size: 0.85rem; font-weight: 600;
    color: var(--accent); text-decoration: none;
    border: 1px solid var(--accent); border-radius: 5px; padding: 0.3rem 0.8rem;
  }
  .pdf-link:hover { background: var(--accent); color: #fff; }

  /* Sections */
  h2 {
    font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--accent); border-bottom: 1px solid var(--rule);
    padding-bottom: 0.3rem; margin: 1.9rem 0 0.9rem;
  }
  h3 { font-size: 1.02rem; margin-top: 1.1rem; }
  h3 + p em { color: var(--muted); font-style: normal; font-size: 0.88rem; }
  p { font-size: 0.94rem; margin-bottom: 0.5rem; }
  ul { margin: 0.35rem 0 0.6rem 1.15rem; }
  li { font-size: 0.94rem; margin-bottom: 0.35rem; }
  strong { font-weight: 600; }
  a { color: var(--accent); }

  footer { margin-top: 2.5rem; font-size: 0.8rem; color: #9a9aa0; text-align: center; }

  /* Print / PDF */
  @media print {
    @page { size: A4; margin: 1.6cm 1.8cm; }
    .page { max-width: none; padding: 0; }
    body { font-size: 10pt; }
    h1 { font-size: 17pt; }
    .tagline { font-size: 10.5pt; }
    .pdf-link { display: none; }
    h2 { break-after: avoid; }
    h3, h3 + p { break-after: avoid; break-inside: avoid; }
    li { break-inside: avoid; }
    a { text-decoration: none; color: var(--text); }
    header { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>{{ name }}</h1>
    <div class="tagline">{{ tagline }}</div>
    <div class="contact">
      <a href="mailto:{{ email }}">{{ email }}</a>
      <span>{{ phone }}</span>
      <span>{{ location }}</span>
      <a href="{{ linkedin }}">LinkedIn</a>
      <a href="{{ github }}">GitHub</a>
    </div>
    <a class="pdf-link" href="{{ pdf_name }}" download>Download PDF</a>
  </header>

  <main>
{{ content }}
  </main>

  <footer>Generated automatically from cv.md</footer>

</div>
</body>
</html>
