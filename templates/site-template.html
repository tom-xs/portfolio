<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<style>
  :root {
    --fg: #1a1a1a;
    --muted: #666;
    --link: #0b3d91;
    --rule: #c9c9c4;
    --bg: #fdfdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e0e0e0;
      --muted: #aaa;
      --link: #64b5f6;
      --rule: #444;
      --bg: #121212;
    }
    code, pre { background: #1e1e1e; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 15px;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  .page { max-width: 84ch; margin: 0 auto; padding: 2rem 2ch 6rem; }
  /* Sticky footer (screen only -- WeasyPrint's flexbox support is too
     limited for print): body always fills the viewport so the background
     paints to the bottom and the footer stays down on short pages.
     .page needs an explicit width: as a flex item with auto margins it
     would otherwise size to fit-content (narrower than 84ch on short
     pages). */
  @media screen {
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .page {
      width: 100%;
      flex: 1; display: flex; flex-direction: column;
    }
    main { flex-grow: 1; }
  }
  .print-only { display: none; }

  .skip-link {
    position: absolute; left: -999px; top: auto; width: 1px; height: 1px;
    overflow: hidden;
  }
  .skip-link:focus {
    position: static; width: auto; height: auto; display: inline-block;
    padding: 0.4rem 1ch; margin: 0.5rem 0; background: var(--bg);
    border: 1px solid var(--fg); color: var(--fg);
  }

  /* Header: spec-sheet look kept via visible borders, monospace-web style */
  .header {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: flex-start; gap: 1rem;
    margin: 1.5rem 0 1rem; padding: 0.75rem 1ch;
    border: 1px solid var(--fg);
  }
  .header-info { min-width: 0; }
  .header .title { margin: 0; font-size: 1.3rem; }
  .header .subtitle { color: var(--muted); }
  .header-contacts {
    display: grid; grid-template-columns: auto auto; gap: 0.3rem 1.5ch;
    font-size: 0.9rem;
  }
  .header-contacts .contact-row { display: contents; }
  .header-contacts .label {
    font-weight: 700; font-size: 0.85rem; text-align: left;
  }
  @media (max-width: 70ch) {
    .header { flex-direction: column; }
    .header-contacts { grid-template-columns: auto 1fr; }
  }

  nav { margin: 0 0 2rem; }
  nav a { color: var(--fg); text-decoration: none; }
  nav a::before { content: "[ "; color: var(--muted); }
  nav a::after { content: " ]"; color: var(--muted); }
  nav a:hover { color: var(--link); text-decoration: underline; }
  nav a.active { font-weight: 700; color: var(--link); }
  nav a + a { margin-left: 1ch; }

  /* Content */
  h1 { font-size: 1.35rem; margin: 1.5rem 0 0.5rem; }
  h2 {
    font-size: 1.1rem; margin: 2rem 0 0.75rem; padding-bottom: 0.25rem;
    border-bottom: 1px dashed var(--rule);
  }
  h2::before { content: "## "; color: var(--muted); }
  h3 { font-size: 1rem; margin: 1.4rem 0 0.4rem; }
  h3::before { content: "### "; color: var(--muted); font-weight: 400; }
  h3 + p em { color: var(--muted); font-style: normal; font-size: 0.85rem; }
  p { margin-bottom: 0.8rem; }
  a { color: var(--link); }
  ul, ol { margin: 0.4rem 0 1rem 3ch; }
  li { margin-bottom: 0.35rem; }
  hr { border: none; border-top: 1px dashed var(--rule); margin: 1.5rem 0; }
  code {
    background: #f0efe6; padding: 0 0.4ch; border: 1px solid var(--rule);
    border-radius: 2px; font-size: 0.92em;
  }
  pre {
    background: #f0efe6; border: 1px solid var(--rule);
    padding: 1ch 2ch; overflow-x: auto; margin: 0.8rem 0 1.2rem;
  }
  pre code { background: none; border: none; padding: 0; }
  table { border-collapse: collapse; margin: 0.8rem 0 1.2rem; }
  table th, table td {
    border: 1px solid var(--rule); padding: 0.2rem 1ch; text-align: left;
  }
  blockquote {
    border-left: 2px solid var(--rule); padding-left: 2ch;
    color: var(--muted); margin: 0.8rem 0;
  }
  .pdf-link { display: inline-block; margin: 0.4rem 0 0.8rem; }

  footer {
    margin-top: 3rem; padding-top: 1rem; border-top: 1px dashed var(--rule);
    color: var(--muted); font-size: 0.85rem;
  }

  /* Print / PDF: Kami resume style (github.com/tw93/kami) -- parchment
     background, serif type, ink-blue accents, thin light rules.
     Single column with real selectable text, so it stays ATS-friendly. */
  @media print {
    @page { size: A4; margin: 8mm 12mm; background: #f5f4ed; }
    body {
      font-family: Charter, "Charis SIL", Georgia, Palatino,
                   "Times New Roman", serif;
      font-size: 9pt; line-height: 1.34; color: #141413; background: #f5f4ed;
      widows: 3; orphans: 3;
    }
    .page { max-width: none; padding: 0; }
    .skip-link { display: none; }
    nav, .header, .pdf-link, footer { display: none; }

    /* Kami header: large serif name left, role + contact right */
    .print-only {
      display: block;
      padding-bottom: 2mm; margin-bottom: 3.5mm;
      border-bottom: 0.6pt solid #e8e6dc;
    }
    .print-only .cv-head {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 1.5mm;
    }
    .print-only h1.cv-name {
      font-size: 22pt; font-weight: 500; letter-spacing: -0.2pt;
      line-height: 1; margin: 0; white-space: nowrap;
    }
    .print-only .cv-role {
      color: #1B365D; font-size: 10.5pt; font-weight: 500;
      margin: 0 0 1mm; text-align: right;
    }
    /* contact line: full width, items spread evenly, none may wrap */
    .print-only p.cv-contact {
      display: flex; justify-content: space-between; flex-wrap: nowrap;
      width: 100%; margin: 0;
      font-size: 8.5pt; color: #6b6a64; line-height: 1.5;
    }
    .print-only .cv-item { white-space: nowrap; }
    .print-only .cv-contact a { color: #3d3d3a; }

    h2 {
      font-size: 11.5pt; font-weight: 500; color: #141413;
      border-bottom: 0.5pt solid #e8e6dc; padding-bottom: 0.6mm;
      margin: 3.5mm 0 1.2mm; break-after: avoid;
    }
    h2::before, h3::before { content: none; }
    h3 {
      font-size: 10pt; font-weight: 500; color: #141413;
      margin: 1.8mm 0 0.5mm; break-after: avoid; break-inside: avoid;
    }
    h3 + p { break-after: avoid; }
    h3 + p em { color: #6b6a64; font-style: normal; font-size: 9pt; }
    p { margin: 0 0 0.6mm; }
    strong { color: #1B365D; font-weight: 600; }
    ul, ol { margin: 0.6mm 0 1.4mm 5mm; }
    li { margin-bottom: 0.4mm; break-inside: avoid; }
    a { color: #1B365D; text-decoration: none; }
    hr { border: none; border-top: 0.5pt solid #e8e6dc; margin: 3mm 0; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="page">

<div class="header">
  <div class="header-info">
    <h1 class="title">Tomas Xavier Santos</h1>
    <span class="subtitle">QA Engineer</span>
  </div>
  <div class="header-contacts">
    <div class="contact-row"><span class="label">Location</span><span>Recife, BR</span></div>
    <div class="contact-row"><span class="label">Email</span><span><a href="mailto:tom.xaviersantos@gmail.com">tom.xaviersantos@gmail.com</a></span></div>
    <div class="contact-row"><span class="label">GitHub</span><span><a href="https://github.com/tom-xs">github.com/tom-xs</a></span></div>
    <div class="contact-row"><span class="label">LinkedIn</span><span><a href="https://www.linkedin.com/in/tomasxs/">linkedin.com/in/tomasxs</a></span></div>
  </div>
</div>

<nav aria-label="Primary navigation">
  <a{{ nav_home }} href="{{ root }}">home</a><a{{ nav_projects }} href="{{ root }}projects/">projects</a><a{{ nav_blog }} href="{{ root }}blog/">blog</a><a{{ nav_cv }} href="{{ root }}cv/">cv</a>
</nav>

<main id="main-content">
{{ content }}
</main>

<footer>generated from markdown &middot; github.com/tom-xs/portfolio</footer>

</div>
</body>
</html>
